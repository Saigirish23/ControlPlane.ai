[pytest]
asyncio_mode = auto
addopts = -p no:launch_testing -p no:launch_ros -p no:colcon_core_warnings_stderr -p no:ament_lint -p no:ament_flake8 -p no:ament_copyright -p no:ament_xmllint -p no:ament_pep257
testpaths =
    tests
    support_agent_mcp/tests
pythonpath =
    .
filterwarnings =
    ignore::DeprecationWarning
    ignore:coroutine 'BaseApiClient.aclose' was never awaited:RuntimeWarning
    ignore::RuntimeWarning:asyncio.base_events
